[package]
name = "lathe"
default-run = "lathe"
version = "0.8.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1.0.103"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
uuid = { version = "1.16", features = ["v4", "v7"] }
# Generates the TS mirror of the event model; `cargo test` writes ../src/types/.
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
dirs = "6.0.0"
tauri-plugin-dialog = "2"
fff-search = "0.10.3"
# Attached images travel to the CLI as base64 content blocks.
base64 = "0.22"
# Desktop notifications are posted directly rather than through
# `tauri-plugin-notification`: only the handle `show` returns reports a click,
# and the plugin drops it. `preview-macos-un` is not optional — the default
# backend is `NSUserNotificationCenter`, which macOS no longer delivers for a
# GUI app at all. See notifications.rs.
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
lathe-agent = { path = "../../../packages/agent" }
sha2 = "0.10"
jsonwebtoken = { version = "9", default-features = false }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-updater = "2.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
