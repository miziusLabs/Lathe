<!doctype html>
<html lang="en" data-theme="one-dark-pro" data-mode="dark" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lathe</title>
    <script>
      // Appearance is fixed in the markup, independent of stored/OS preferences.
      // Reveal the macOS-only window material before React mounts.
      // useVibrancy clears this while fullscreen.
      if (/Mac/.test(navigator.platform)) {
        document.documentElement.dataset.vibrancy = "";
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
